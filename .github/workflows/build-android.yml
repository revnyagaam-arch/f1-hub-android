name: Build F1 Hub Russia APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: revnyagaam-arch/f1-hub-russia
          path: website

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy website
        run: |
          test -f website/index.html
          test -f website/logo.png
          rm -rf app/www
          mkdir -p app/www
          cp -R website/. app/www/
          rm -rf app/www/.git app/www/.github

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Sync website
        working-directory: app
        run: npx cap sync android

      - name: Generate and configure launcher icons
        working-directory: app
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import xml.etree.ElementTree as ET

          source = Path("www/logo.png")
          if not source.is_file():
              raise SystemExit("ERROR: www/logo.png is missing")

          logo = Image.open(source).convert("RGBA")
          if logo.width == 0 or logo.height == 0:
              raise SystemExit("ERROR: logo.png is empty")

          # Legacy launcher icons.
          res = Path("android/app/src/main/res")
          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          # Put the full logo on a black square without stretching it.
          side = max(logo.width, logo.height)
          square = Image.new("RGBA", (side, side), (0, 0, 0, 255))
          logo.thumbnail((side, side), Image.Resampling.LANCZOS)
          square.alpha_composite(
              logo,
              ((side - logo.width) // 2, (side - logo.height) // 2)
          )

          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = square.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")

              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).ellipse(
                  (0, 0, size - 1, size - 1), fill=255
              )
              round_icon = icon.copy()
              round_icon.putalpha(mask)
              round_icon.save(folder / "ic_launcher_round.png")

          # Adaptive icon foreground: keep the logo centred with transparent
          # space around it so Android can apply its launcher shape safely.
          adaptive_size = 432
          foreground = Image.new(
              "RGBA", (adaptive_size, adaptive_size), (0, 0, 0, 0)
          )
          mark = square.copy()
          mark.thumbnail((adaptive_size * 2 // 3, adaptive_size * 2 // 3),
                         Image.Resampling.LANCZOS)
          foreground.alpha_composite(
              mark,
              ((adaptive_size - mark.width) // 2,
               (adaptive_size - mark.height) // 2)
          )

          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          foreground.save(drawable / "ic_launcher_foreground.png")

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '  <color name="ic_launcher_background">#000000</color>\n'
              '</resources>\n',
              encoding="utf-8"
          )

          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <background android:drawable="@color/ic_launcher_background"/>\n'
              '  <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          (adaptive / "ic_launcher.xml").write_text(
              adaptive_xml, encoding="utf-8"
          )
          (adaptive / "ic_launcher_round.xml").write_text(
              adaptive_xml, encoding="utf-8"
          )

          # Explicitly configure the Android app to use these resources.
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit("ERROR: AndroidManifest.xml is missing")

          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"
          application = root.find("application")
          if application is None:
              raise SystemExit("ERROR: application element is missing")

          application.set(android_ns + "icon", "@mipmap/ic_launcher")
          application.set(android_ns + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          print("Launcher icon files generated and manifest configured.")
          PY

      - name: Verify launcher icon resources
        working-directory: app
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'ic_launcher' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F1-Hub-Russia-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
