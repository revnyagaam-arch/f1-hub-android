name: Build F1 Hub Russia APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: revnyagaam-arch/f1-hub-russia
          path: website

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy website
        run: |
          test -f website/index.html
          test -f website/logo.png
          rm -rf app/www
          mkdir -p app/www
          cp -R website/. app/www/
          rm -rf app/www/.git app/www/.github
          test -f app/www/logo.png

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Sync website
        working-directory: app
        run: npx cap sync android

      - name: Generate app launcher icon
        working-directory: app
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import xml.etree.ElementTree as ET

          res = Path("android/app/src/main/res")
          source = Path("www/logo.png")

          if not source.is_file():
              raise SystemExit("ERROR: www/logo.png not found")

          logo = Image.open(source).convert("RGBA")
          if logo.width == 0 or logo.height == 0:
              raise SystemExit("ERROR: logo.png is empty")

          # Create a square icon with a black background.
          side = max(logo.width, logo.height)
          square = Image.new("RGBA", (side, side), (0, 0, 0, 255))
          logo.thumbnail((side, side), Image.Resampling.LANCZOS)
          square.alpha_composite(
              logo,
              ((side - logo.width) // 2, (side - logo.height) // 2)
          )

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = square.resize(
                  (size, size), Image.Resampling.LANCZOS
              )
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          # Remove adaptive icon definitions so Android uses PNG icons.
          adaptive = res / "mipmap-anydpi-v26"
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              path = adaptive / name
              if path.exists():
                  path.unlink()

          # Explicitly set icon references in the manifest.
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit("ERROR: AndroidManifest.xml not found")

          ET.register_namespace(
              "android", "http://schemas.android.com/apk/res/android"
          )
          tree = ET.parse(manifest)
          application = tree.getroot().find("application")

          if application is None:
              raise SystemExit("ERROR: application element not found")

          ns = "{http://schemas.android.com/apk/res/android}"
          application.set(ns + "icon", "@mipmap/ic_launcher")
          application.set(ns + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(
              manifest, encoding="utf-8", xml_declaration=True
          )

          print("Launcher PNG icons generated and manifest updated.")
          PY

      - name: Verify launcher icon
        working-directory: app
        run: |
          set -eu
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          grep -q 'android:icon="@mipmap/ic_launcher"' \
            android/app/src/main/AndroidManifest.xml
          echo "Launcher icon files verified."

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -s app/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F1-Hub-Russia-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

