name: Build F1 Hub Russia APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: revnyagaam-arch/f1-hub-russia
          path: website

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy full website
        run: |
          rm -rf app/www
          mkdir -p app/www
          cp -R website/. app/www/
          rm -rf app/www/.git app/www/.github

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Sync website into Android
        working-directory: app
        run: npx cap sync android

      - name: Build APK
        working-directory: app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F1-Hub-Russia-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
